apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simple-go.fullname" . }}
  labels:
    {{- include "simple-go.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "simple-go.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simple-go.selectorLabels" . | nindent 8 }}
    spec:
      # The service waits 5 seconds after failing /readyz and then drains for
      # up to 10 seconds, so 30 seconds is enough.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simple-go
          image: {{ include "simple-go.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ADDR
              value: {{ printf ":%v" .Values.containerPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
