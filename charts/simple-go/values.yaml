replicaCount: 2

image:
  repository: ghcr.io/ahmedbadawy4/simple-go
  # Empty means the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# The container listens on this port. The service sets it with the ADDR
# environment variable.
containerPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    memory: 64Mi

# Creates a ServiceMonitor for the Prometheus Operator. Turn it on only in a
# cluster where the ServiceMonitor CRD exists, for example one that runs
# kube-prometheus-stack.
serviceMonitor:
  enabled: false
  interval: 30s
  # Extra labels, for a Prometheus that selects ServiceMonitors by label.
  labels: {}
